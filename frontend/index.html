async function readSSE(r,a){const rd=r.body.getReader(),dec=new TextDecoder();let buf='';
 for(;;){const{done,value}=await rd.read();if(done)break;buf+=dec.decode(value,{stream:true});let i;while((i=buf.search(/\r?\n\r?\n/))>=0){const blk=buf.slice(0,i);buf=buf.slice(i).replace(/^\r?\n\r?\n/,'');sse(blk,a)}}
 if(buf.trim())sse(buf,a);if(!a.text)throw new ApiError('Stream ended without content',true)}
function sse(blk,a){let ev='message';const d=[];for(const l of blk.split(/\r?\n/)){if(l.startsWith('event:'))ev=l.slice(6).trim();else if(l.startsWith('data:'))d.push(l.slice(5).replace(/^ /,''))}
 const s=d.join('\n');if(!s||s==='[DONE]')return;let j=null;try{j=JSON.parse(s)}catch{}
 if(ev==='error')throw new ApiError((j&&(j.error||j.message))||s,true);
 if(ev==='citation'||ev==='citations'){a.cites.push(...(Array.isArray(j)?j:j?[j]:[]))}else{if(j&&Array.isArray(j.citations))a.cites=j.citations;a.text+=j?(j.token??j.delta??j.text??j.content??''):s}
 renderMsgs()}
/* ---- Evidence drawer ---- */
let lastFocus=null;
function drawer(h){const d=$('#drawer');if(!d.classList.contains('open')){lastFocus=document.activeElement;d.inert=false;d.setAttribute('aria-hidden','false');d.classList.add('open');$('#scrim').classList.add('on')}
 d.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px"><h2 style="margin:0;font-size:16px">Evidence</h2><button class="btn sm" data-act="closedrawer" id="dc">Close</button></div>${h}`;$('#dc').focus()}
function closeDrawer(){const d=$('#drawer');if(!d.classList.contains('open'))return;d.classList.remove('open');d.inert=true;d.setAttribute('aria-hidden','true');$('#scrim').classList.remove('on');lastFocus&&lastFocus.focus&&lastFocus.focus()}
async function showEvidence({id,data}){drawer('<div class="sk"></div><div class="sk"></div>');let d=data;
 if(!d&&id){try{d=await api(E.evidence+encodeURIComponent(id));if(!d||typeof d!=='object')throw new ApiError('Malformed evidence response',false)}catch(e){drawer(`<div class="banner" role="alert">Could not load evidence: ${esc(e.message)}</div><button class="btn" id="evr">Retry</button>`);$('#evr').onclick=()=>showEvidence({id});return}}
 const url=d.url||d.source_url||'',pub=d.publisher||d.source,ex=d.excerpt||d.quote||d.text||d.snippet,when=d.published_at||d.published||d.publication_timestamp,ver=d.version||d.document_version,hash=d.hash||d.content_hash,rel=d.relationships||d.relations,none='<span class="mut">Not provided by the backend</span>';
 const row=(k,v)=>`<div class="fr"><b>${k}</b><div>${v||none}</div></div>`,ok=/^https?:\/\//i.test(url);
 drawer(row('Source URL',ok?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer" style="color:var(--a)">${esc(url)}</a>`:'')+row('Publisher',esc(pub))+`<div class="fr"><b>Supporting excerpt (verbatim)</b>${ex?`<blockquote>${esc(ex)}</blockquote>`:none}</div>`+row('Published',when?esc(abs(when)):'')+row('Document version',esc(ver))+row('Content hash',hash?`<span class="mono">${esc(hash)}</span>`:'')+row('Graph relationships',Array.isArray(rel)&&rel.length?'<ul>'+rel.map(x=>`<li>${esc(typeof x==='string'?x:[x.source,x.type||x.kind,x.target].filter(Boolean).join(' → '))}</li>`).join('')+'</ul>':'')+(ok?`<a class="btn pri" href="${esc(url)}" target="_blank" rel="noopener noreferrer">Open original source</a>`:''))}
/* ---- Views ---- */
const vOverview=()=>kpis()+`<div class="cols"><div class="col">${feedPanel()}</div><div class="col">${graphPanel(false)}${copilot(false)}</div></div>`;
const vInvest=()=>{const x=S.signals.find(s=>s.id===S.sel);return`<div class="cols"><div class="col">${copilot(true)}</div><div class="col"><section class="card"><h2>Investigation context</h2>${x?`<p style="margin:0"><span class="badge s-${esc(x.severity)}">${esc(x.severity)}</span> ${esc(x.title)}${x.demo?' <span class="tag">Demo fixture</span>':''}</p>`:'<p class="mut">No signal selected. Choose one in Live Signals.</p>'}</section>${graphPanel(false)}</div></div>`};
const vGraph=()=>graphPanel(true)+`<section class="card" style="margin-top:16px"><h2>Relationships${demoTag('graph')}</h2>${S.graph.edges.map(e=>`<div style="padding:4px 0;border-bottom:1px solid var(--b)"><span class="badge ${e.kind}">${e.kind}</span> ${esc(lbl(e.s))} → ${esc(lbl(e.t))}</div>`).join('')||'<p class="mut">No relationships recorded.</p>'}</section>`;
function vReports(){return`<section class="card"><h2>Impact reports${demoTag('graph')}</h2><p class="mut" style="margin-top:0">Affected projects and services are derived from the current graph snapshot (3 hops). Run backend analysis to request an evidence-backed report.</p>${S.signals.map(x=>{const t=(x.tech||'').toLowerCase(),r=S.graph.nodes.find(n=>n.id.toLowerCase()===t||n.label.toLowerCase()===t),sub=r?blast(r.id,3):{nodes:[]},pj=sub.nodes.filter(n=>n.type==='project'),sv=sub.nodes.filter(n=>n.type==='service');
 return`<article class="ev s-${esc(x.severity)}"><div class="evh"><span class="badge">${esc(x.severity)}</span>${x.demo?'<span class="tag">Demo fixture</span>':''}</div><h3>${esc(x.title)}</h3><p>${r?`${pj.length} project(s), ${sv.length} service(s) potentially affected: ${esc([...pj,...sv].map(n=>n.label).join(', ')||'none')}`:'No matching graph entity; impact cannot be derived.'}</p><div class="acts"><button class="btn sm pri" data-act="analyze" data-id="${esc(x.id)}">Run backend analysis</button><button class="btn sm" data-act="blast" data-id="${esc(x.id)}">Inspect Blast Radius</button></div></article>`}).join('')||'<p class="mut">No signals to report on.</p>'}</section>`}
const rrow=r=>`<div class="ru ${r.enabled?'':'off'}"><div><b>${esc(r.name)}</b><div class="mono mut">${esc(r.pattern)}</div></div><div><span class="badge s-${esc(r.threshold)}">≥ ${esc(r.threshold)}</span></div><div class="mut">${esc(r.target)}<br>${esc(r.channels.join(', ')||'no channels')}</div><div class="mut">${r.enabled?'Enabled':'Paused'}<br>${r.last?`Last run: ${esc(r.last.status)}, ${ago(r.last.time)}`:'Never run'}</div>
 <div class="acts"><button class="btn sm" data-act="togglerule" data-id="${esc(r.id)}">${r.enabled?'Pause':'Resume'}</button><button class="btn sm" data-act="editrule" data-id="${esc(r.id)}">Edit</button><button class="btn sm dng" data-act="delrule" data-id="${esc(r.id)}">Delete</button></div></div>`;
const vRules=()=>`<section class="card"><h2>Monitoring rules${demoTag('rules')}<span class="sp"></span><button class="btn pri sm" data-act="newrule">New rule</button></h2>${errB('rules')}${S.rules.map(rrow).join('')||'<p class="mut">No monitoring rules yet. Create one to get alerted on matching signals.</p>'}</section>`;
const vSources=()=>`<section class="card"><h2>Sources and ingestion health${demoTag('sources')}</h2>${errB('sources')}${S.sources.map(s=>`<div class="ru" style="grid-template-columns:minmax(0,2fr) 1fr 1fr 1fr"><b>${esc(s.name)}</b><span class="mut">${esc(s.type)}</span><span><i class="dot ${s.status==='healthy'?'ok':s.status==='failing'?'bad':'warn'}"></i> ${esc(s.status)}</span><span class="mut">${s.last?'Last ingest '+ago(s.last):'No ingest yet'}</span></div>`).join('')||'<p class="mut">No sources configured.</p>'}</section>`;
const vSettings=()=>`<section class="card"><h2>Settings</h2><form data-form="settings" novalidate><div class="fld"><label for="sb">Backend base URL</label><input id="sb" name="base" value="${esc(CONFIG.baseUrl)}" placeholder="http://127.0.0.1:8000" inputmode="url"></div><div class="fld"><label for="st">Request timeout (ms)</label><input id="st" name="to" type="number" min="1000" max="60000" value="${CONFIG.timeoutMs}"></div><p class="ferr" id="ferr" role="alert"></p><button class="btn pri">Save and reconnect</button></form>
 <p class="mut">Mode: <b>${S.mode}</b>. Endpoint paths live in <span class="mono">CONFIG.endpoints</span> at the top of this file's script; adjust them to match your FastAPI routes. No secrets are stored in the frontend.</p><pre>${esc(JSON.stringify(E,null,1))}</pre><p class="mut">Shortcuts: <kbd>Ctrl</kbd>/<kbd>⌘</kbd> + <kbd>K</kbd> opens the command palette. <kbd>Esc</kbd> closes panels.</p></section>`;
function renderView(){const m=$('#main');if(!m)return;let h=S.mode==='offline'?`<div class="banner" role="alert">Backend unreachable at ${esc(CONFIG.baseUrl||'relative backend')} (${esc(S.err.health||'no response')}). Demo Mode: every value shown is a labeled fixture, not live data. <button class="btn sm" data-act="reload">Retry connection</button></div>`:'';
 h+=({overview:vOverview,signals:feedPanel,investigations:vInvest,graph:vGraph,reports:vReports,rules:vRules,sources:vSources,settings:vSettings})[S.view]();m.innerHTML=h;renderMsgs()}
const renderAll=()=>{renderHeader();renderView()};
function go(v){S.view=v;renderAll();scrollTo(0,0);$('#main').focus({preventScroll:true})}
/* ---- Rules management ---- */
const dlg=()=>$('#dlg');
function showDlg(h){dlg().innerHTML=h;if(!dlg().open)dlg().showModal()}
function openRule(id){const r=S.rules.find(x=>x.id===id)||{name:'',pattern:'',threshold:'high',target:'technology',channels:['email'],enabled:true},o=(a,v)=>a.map(x=>`<option ${x===v?'selected':''}>${x}</option>`).join('');
 showDlg(`<form data-form="rule" data-id="${esc(id||'')}" novalidate><h2 style="margin-top:0">${id?'Edit':'New'} monitoring rule</h2><div class="fld"><label for="rn">Rule name</label><input id="rn" name="name" value="${esc(r.name)}" maxlength="60"></div><div class="fld"><label for="rp">Technology pattern (letters, digits, * . - / @)</label><input id="rp" name="pattern" value="${esc(r.pattern)}" maxlength="80" class="mono"></div>
 <div class="fld"><label for="rt">Severity threshold</label><select id="rt" name="threshold">${o(['low','medium','high','critical'],r.threshold)}</select></div><div class="fld"><label for="rg">Target type</label><select id="rg" name="target">${o(['technology','dependency','project','service'],r.target)}</select></div>
 <div class="fld"><fieldset><legend>Notification channels</legend>${['email','slack','webhook','pagerduty'].map(c=>`<label><input type="checkbox" name="ch" value="${c}" ${r.channels.includes(c)?'checked':''}> ${c}</label>`).join('')}</fieldset></div><div class="fld"><label><input type="checkbox" name="enabled" ${r.enabled?'checked':''}> Enabled</label></div>
 <p class="ferr" id="ferr" role="alert"></p><div class="acts" style="justify-content:flex-end"><button type="button" class="btn" data-act="closedlg">Cancel</button><button class="btn pri">Save rule</button></div></form>`);$('#rn').focus()}
const liveRules=()=>S.mode==='live'&&!S.demo.rules;
async function saveRule(f){const fd=new FormData(f),r={name:(fd.get('name')||'').trim(),pattern:(fd.get('pattern')||'').trim(),threshold:fd.get('threshold'),target:fd.get('target'),channels:fd.getAll('ch'),enabled:fd.get('enabled')==='on'},er=[];
 if(r.name.length<3)er.push('Name must be at least 3 characters.');if(!r.pattern||!/^[\w.*\-\/@:]+$/.test(r.pattern))er.push('Pattern is required and may only contain letters, digits and * . - / @ :');if(!r.channels.length)er.push('Choose at least one notification channel.');
 const fe=$('#ferr');if(er.length){fe.textContent=er.join(' ');return}
 const id=f.dataset.id,old=S.rules.find(x=>x.id===id);let saved={...r,id:id||'local-'+Date.now(),last:old?.last||null};
 try{if(liveRules()){const res=await api(id?E.rules+'/'+encodeURIComponent(id):E.rules,{method:id?'PUT':'POST',body:r});saved=nRule({...r,...(res&&typeof res==='object'?res:{}),id:(res&&res.id)||id})}}catch(e){fe.textContent='Save failed: '+e.message;return}
 const i=S.rules.findIndex(x=>x.id===saved.id);if(i>=0)S.rules[i]=saved;else S.rules.push(saved);dlg().close();renderView();toast(liveRules()?'Rule saved.':'Rule saved locally (demo data, not sent to a backend).','ok')}
async function toggleRule(id){const r=S.rules.find(x=>x.id===id);if(!r)return;try{if(liveRules()){try{await api(E.rules+'/'+encodeURIComponent(id),{method:'PATCH',body:{enabled:!r.enabled}})}catch{await api(E.rules+'/'+encodeURIComponent(id)+(r.enabled?'/pause':'/resume'),{method:'POST'})}}r.enabled=!r.enabled;renderView();toast(`Rule ${r.enabled?'resumed':'paused'}${liveRules()?'':' (local only)'}.`,'ok')}catch(e){toast('Could not update rule: '+e.message,'err')}}
async function delRule(id){try{if(liveRules())await api(E.rules+'/'+encodeURIComponent(id),{method:'DELETE'});S.rules=S.rules.filter(x=>x.id!==id);dlg().close();renderView();toast('Rule deleted.','ok')}catch(e){$('#ferr').textContent='Delete failed: '+e.message}}
async function analyze(id){showDlg('<div class="sk"></div>');try{const r=await api(E.impact+'?signal_id='+encodeURIComponent(id));showDlg(`<h2 style="margin-top:0">Impact analysis</h2><pre>${esc(JSON.stringify(r,null,2)).slice(0,6000)}</pre><div class="acts" style="justify-content:flex-end"><button class="btn" data-act="closedlg">Close</button></div>`)}catch(e){showDlg(`<h2 style="margin-top:0">Impact analysis failed</h2><p class="banner" role="alert">${esc(e.message)}${S.mode!=='live'?' The backend is not connected, so no analysis was generated.':''}</p><div class="acts" style="justify-content:flex-end"><button class="btn" data-act="closedlg">Close</button></div>`)}}
/* ---- Command palette ---- */
let cIdx=0,cList=[];
function cmdItems(){const sel=id=>{S.sel=id;rootFrom(id);go('signals')};
 return[{g:'Action',l:'Sync now (trigger ingestion)',run:sync},{g:'Action',l:'Create monitoring rule',run:()=>{go('rules');openRule()}},{g:'Action',l:'Open Copilot',run:()=>{go('investigations');$('#cin')?.focus()}},...VIEWS.map(([k,l])=>({g:'Navigate',l:'Go to '+l,run:()=>go(k)})),
 ...S.signals.map(x=>({g:'Signal',l:x.title,run:()=>sel(x.id)})),...S.graph.nodes.map(n=>({g:n.type==='project'?'Internal project':n.type==='service'?'Service':'Technology',l:n.label,run:()=>{S.root=n.id;S.pick=n.id;go('graph')}}))]}
function cmdRender(){const q=$('#cq').value.toLowerCase().trim();cList=cmdItems().filter(i=>!q||(i.l+' '+i.g).toLowerCase().includes(q)).slice(0,40);cIdx=Math.min(cIdx,Math.max(0,cList.length-1));
 $('#cl').innerHTML=cList.map((i,k)=>`<li role="option" id="o${k}" data-k="${k}" aria-selected="${k===cIdx}"><span>${esc(i.l)}</span><span>${esc(i.g)}</span></li>`).join('')||'<li class="mut">No matches</li>';$('#cq').setAttribute('aria-activedescendant',cList.length?'o'+cIdx:'');$('#o'+cIdx)?.scrollIntoView({block:'nearest'})}

const ACT={nav:d=>go(d.v),cmd:openCmd,sync,reload:()=>{S.busyLoad=false;load()},
 blast:d=>{S.sel=d.id;rootFrom(d.id);S.pick=null;go(S.view==='overview'||S.view==='graph'?S.view:'graph')},
 invest:d=>{const x=S.signals.find(s=>s.id===d.id);if(!x)return;S.sel=d.id;rootFrom(d.id);if(S.view==='overview'||S.view==='investigations')renderAll();else go('investigations');ask(`Investigate “${x.title}”: which internal dependencies, projects and services may be affected, and what evidence supports this assessment?`)},
 evsig:d=>showEvidence({id:d.id}),depth:d=>{S.depth=+d.n;refreshGraph()},fullgraph:()=>go('graph'),node:d=>{S.pick=d.id;refreshGraph()},
 prompt:d=>ask(PROMPTS[+d.i]),send:()=>ask($('#cin')?.value),retry:d=>{const m=S.msgs[+d.i];if(!m)return;const t=m.retry;S.msgs.splice(+d.i-1,2);ask(t)},

 newrule:()=>openRule(),editrule:d=>openRule(d.id),togglerule:d=>toggleRule(d.id),analyze:d=>analyze(d.id),closedlg:()=>dlg().close(),closedrawer:closeDrawer,

 confirmdel:d=>delRule(d.id),clearf:()=>{S.f={q:'',sev:'all',cat:'all',sort:S.f.sort};renderView()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b&&ACT[b.dataset.act])ACT[b.dataset.act](b.dataset,e);const li=e.target.closest('#cl li[data-k]');if(li)runCmd(+li.dataset.k);if(e.target===$('#cmd'))$('#cmd').close();if(e.target===$('#scrim'))closeDrawer()});

document.addEventListener('input',e=>{const i=e.target.id;if(i==='fq'){S.f.q=e.target.value;refreshFeed()}else if(i==='cin')S.draft=e.target.value;else if(i==='cq'){cIdx=0;cmdRender()}});
document.addEventListener('change',e=>{const m={fs:'sev',fc:'cat',fo:'sort'}[e.target.id];if(m){S.f[m]=e.target.value;refreshFeed()}});
document.addEventListener('mouseover',e=>{const n=e.target.closest('.gn');const g=$('#gi');if(n&&g&&!S.pick)g.textContent=n.dataset.sum});
document.addEventListener('keydown',e=>{
 if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#cmd').open?$('#cmd').close():openCmd();return}
 if(e.key==='Escape'&&$('#drawer').classList.contains('open')&&!$('#dlg').open&&!$('#cmd').open)closeDrawer();

 if(e.target.id==='cq'){if(e.key==='ArrowDown'){e.preventDefault();cIdx=Math.min(cList.length-1,cIdx+1);cmdRender()}else if(e.key==='ArrowUp'){e.preventDefault();cIdx=Math.max(0,cIdx-1);cmdRender()}else if(e.key==='Enter'){e.preventDefault();runCmd(cIdx)}}
 if((e.key==='Enter'||e.key===' ')&&e.target.classList?.contains('gn')){e.preventDefault();ACT.node(e.target.dataset)}});
document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
 if(f.dataset.form==='rule')saveRule(f);
 else{const fd=new FormData(f),b=(fd.get('base')||'').trim(),t=+fd.get('to');if(!b&&b!==''){/* allowed */}else if(!/^https?:\/\/[^\s]+$/i.test(b)&&b!==''){fe.textContent='Enter a valid http(s) URL or leave empty for relative backend.';return}if(!(t>=1000&&t<=60000)){$('#ferr').textContent='Timeout must be between 1000 and 60000 ms.';return}
  CONFIG.baseUrl=b;CONFIG.timeoutMs=t;ls.set('oracle.base',b);ls.set('oracle.to',String(t));S.mode='checking';S.busyLoad=false;toast('Settings saved. Reconnecting…','ok');load()}});
$('#cta').addEventListener('click',enter);$('#skip').addEventListener('click',enter);
H=hero();renderAll();load();setInterval(()=>{if(!document.hidden)load(true)},30000);
})();
